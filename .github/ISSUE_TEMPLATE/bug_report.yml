name: 问题报告 / Bug report
description: 报告可复现的缺陷 / Report a reproducible defect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。安全漏洞请勿通过公开表单披露，参见 [SECURITY.md](https://github.com/three-water666/webcode/blob/main/SECURITY.md)。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述 / Summary
      description: 简洁说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 提供最小、可重复的步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: input
    id: webcode-version
    attributes:
      label: webcode 版本 / Version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      description: OS、VS Code 版本、浏览器及相关 AI 站点。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 请先移除令牌、个人数据和其他敏感信息。
    validations:
      required: false
