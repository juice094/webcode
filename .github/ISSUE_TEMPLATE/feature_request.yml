name: 功能建议 / Feature request
description: 提出功能或改进建议 / Suggest a feature or improvement
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，确认没有重复建议。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 描述当前遇到的限制或需求。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 描述期望的行为；如有替代方案也请说明。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 使用场景 / Use case
      description: 谁会使用此功能，以及它如何帮助完成任务？
    validations:
      required: true
