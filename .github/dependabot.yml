# Dependency updates.
#
# Why the grouping is split this way: a single group covering every production
# dependency produced PRs too large to create, so Dependabot reported success
# while opening nothing. Security updates now get their own group so they are
# never blocked behind a routine minor bump.
#
# Constraint: Dependabot rejects the file when two entries share
# (package-ecosystem, directory, target-branch). The production and development
# splits therefore live inside one entry's `groups`, which is why there is a
# single `directory: /` block below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Security fixes are small and urgent; keep them out of the routine groups.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      # Routine production minors are separate so one failed lockfile refresh
      # cannot block a security update.
      production-minor:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps need a human to read the changelog first.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /bridge-browser
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      bridge-security:
        applies-to: security-updates
        patterns:
          - "*"
      bridge-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
